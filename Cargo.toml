[package]
name = "basico"
version = "0.1.0"
edition = "2024"

[lints.rust]
# Ninguém merece aviso que código não usado, calma aí eu vou usar ainda (algum dia)
unused = "allow"
# if you wish, you can even toss #![forbid(unsafe_code)] into your code base to statically guarantee that you're only writing Safe Rust.
unsafe_code = "forbid"

[dependencies]
crossterm = "0.29.0"
oneshot = { version = "0.2.1", features = ["std"] }
rand = "0.10.1"
rustyline = "18.0.0"

[dev-dependencies]
criterion = "0.8.2"
slotmap = "1.1.1"

[[bench]]
name = "basic"
harness = false
